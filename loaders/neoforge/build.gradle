plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.115'
}

// NeoForge 1.21.1 port. An independent Gradle build so NeoForge's toolchain never reaches
// the Fabric build: `./gradlew -p loaders/neoforge build`.
version = project.mod_version
group = project.maven_group

// This project is its own Gradle root, so the repository lives two levels up.
def repoRoot = project.file('../..')

base {
    archivesName = "${project.archives_base_name}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version
    runs {
        client {
            client()
        }
    }
    mods {
        bedrock_shaders {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.lwjgl:lwjgl-opengl:3.3.3'
}

sourceSets {
    main {
        java {
            // Loader-agnostic code: the shared config/asset model plus the renderer pieces
            // that never touch a Minecraft class. BedrockShadersMod is plain Java, and the
            // Fabric entrypoint lives in src/client/java, which this build does not source.
            srcDir new File(repoRoot, 'src/main/java')
            // Official-mapped, loader-agnostic client code: the frame calculation, the
            // Bedrock asset loader, the GUI and the three mixins.
            srcDir new File(repoRoot, 'loaders/common-official/src/main/java')
            srcDir 'src/main/java'
        }
        resources {
            // Lang, icon, the Bedrock JSON pack and the GLSL that syncShaders generates.
            // Deliberately not the root src/client/resources: that holds the Yarn mixin config.
            srcDir new File(repoRoot, 'src/main/resources')
            srcDir new File(repoRoot, 'loaders/common-official/src/main/resources')
            srcDir 'src/main/resources'
            exclude 'fabric.mod.json'
            exclude 'quilt.mod.json'
            exclude 'bedrock_shaders.client.mixins.json'
            exclude '**/*.accesswidener'
        }
    }
}

// Regenerate the packaged shader sources from the root project's shadersrc/, exactly like
// the Fabric build does; without this the ported jar would ship without any GLSL.
def syncShaders = tasks.register('syncShaders', Exec) {
    group = 'build'
    description = 'Regenerates assets/bedrock_shaders/bedrockshader from the root shadersrc/.'
    workingDir = repoRoot
    commandLine 'node', 'verification/sync_shaders.mjs'
    onlyIf { new File(repoRoot, 'verification/sync_shaders.mjs').isFile() }
}

tasks.named('processResources') {
    dependsOn syncShaders
    // The mod metadata is provided once by this project's source set; if another source
    // directory contributes the same entry, keep the first and drop the duplicate rather
    // than failing or shipping two copies.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version, 'neoforge_version': project.neoforge_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
