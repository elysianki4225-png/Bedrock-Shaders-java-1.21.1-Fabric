plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.115'
}

// NeoForge 1.21.1 port. Built as a separate Gradle project so the Fabric build never
// has to download NeoForge's toolchain: `./gradlew -p loaders/neoforge build`.
version = rootProject.property('mod_version')
group = rootProject.property('maven_group')

base {
    archivesName = "${rootProject.property('archives_base_name')}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version
    runs {
        client {
            client()
        }
    }
    mods {
        bedrock_shaders {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.lwjgl:lwjgl-opengl:3.3.3'
}

sourceSets {
    main {
        java {
            // Loader-agnostic code: the shared asset/config model and the parts of the
            // renderer that never touch a Minecraft class.
            srcDir rootProject.file('src/main/java')
            // Official-mapped, loader-agnostic client code: the frame calculation, the
            // Bedrock asset loader, the GUI and the three mixins.
            srcDir rootProject.file('loaders/common-official/src/main/java')
            srcDir 'src/main/java'
        }
        resources {
            // Lang, icon, the Bedrock JSON pack and the GLSL that syncShaders generates.
            // Deliberately not src/client/resources: that holds the Yarn mixin config.
            srcDir rootProject.file('src/main/resources')
            srcDir rootProject.file('loaders/common-official/src/main/resources')
            srcDir 'src/main/resources'
            exclude 'fabric.mod.json'
            exclude 'quilt.mod.json'
            exclude 'bedrock_shaders.client.mixins.json'
            exclude '**/*.accesswidener'
        }
    }
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version, 'neoforge_version': project.neoforge_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
