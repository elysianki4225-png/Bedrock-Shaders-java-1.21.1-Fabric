name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate shaders (Khronos glslang)
        run: |
          cd verification
          npm install --no-audit --no-fund
          node validate_shaders.mjs

      - name: Validate Bedrock assets
        run: python3 verification/validate_assets.py

      - name: Build with Gradle
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish failure report
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 verification/report_failure.py

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-shaders-jar
          path: build/libs/*.jar
          if-no-files-found: error
