name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate shaders (Khronos glslang)
        run: |
          cd verification
          npm install --no-audit --no-fund
          node validate_shaders.mjs

      - name: Validate Bedrock assets
        run: python3 verification/validate_assets.py

      - name: Validate runtime shader pack contract
        run: python3 verification/validate_pack.py

      - name: Test .mcpack importer + localisation
        run: python3 verification/test_importer.py

      - name: Build with Gradle
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish failure report
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 verification/report_failure.py

      - name: Upload mod jars (Fabric + Quilt)
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-shaders-jars-fabric-quilt
          path: build/libs/*.jar
          if-no-files-found: error

      # Blob storage is unreachable from the Arena sandbox, so also publish the
      # jar through git itself: commit it into dist/ on the same branch.
      - name: Publish jar to dist/
        if: "success() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'ci: publish')"
        run: |
          set -e
          mkdir -p dist
          # Only replace the Fabric/Quilt jars this job produced; the loader jobs publish
          # their own jars into the same folder from other runners.
          rm -f dist/bedrock-shaders-1.0.0.jar dist/bedrock-shaders-1.0.0-sources.jar \
                dist/bedrock-shaders-quilt-*.jar
          cp build/libs/*.jar dist/
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "jar unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "ci: publish jar [skip ci]"
          git push

  # Forge and NeoForge are independent Gradle builds (loaders/<loader>) so their
  # toolchains never leak into the Fabric build. They are compiled here, which is the
  # only place the official-mapped port is actually type-checked.
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            task: build
          - loader: forge
            task: build
    name: build (${{ matrix.loader }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build ${{ matrix.loader }}
        id: gradle
        continue-on-error: true
        working-directory: loaders/${{ matrix.loader }}
        run: |
          set +e
          chmod +x ../../gradlew
          ../../gradlew --version > gradle-version.log 2>&1
          echo "gradle --version exit: $?" >> gradle-version.log
          ../../gradlew build --stacktrace --console=plain > build.log 2>&1
          echo "build exit: $?" >> build.log
          echo "=== jars produced ===" >> build.log
          find build -name '*.jar' -printf '%p %s bytes\n' >> build.log 2>&1 || true
          echo "=== first error lines ===" >> build.log
          grep -nE "error:|FAILURE:|What went wrong|A problem occurred|Could not|Unsupported class|Plugin|not found" build.log | head -40 >> build.log 2>&1 || true
          tail -c 3000 build.log || true

      # The sandbox cannot read Actions log blobs, so a failing loader build posts its
      # own diagnostics as an issue: that is the only channel back to the maintainer.
      - name: Publish ${{ matrix.loader }} diagnostics
        if: steps.gradle.outcome == 'failure'
        working-directory: loaders/${{ matrix.loader }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "workflow run: $GITHUB_RUN_ID"
            echo
            echo "### gradle --version"
            echo '```'
            head -20 gradle-version.log 2>/dev/null || echo "no gradle-version.log"
            echo '```'
            echo "### build.log (head, first 250 lines)"
            echo '```'
            head -250 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > /tmp/report.md
          gh issue create --repo $GITHUB_REPOSITORY \
            --title "${{ matrix.loader }} build failure $GITHUB_RUN_ID" \
            --body-file /tmp/report.md || true

      - name: Upload ${{ matrix.loader }} jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-shaders-${{ matrix.loader }}
          # upload-artifact resolves paths against the workspace root, not
          # working-directory, so this must stay repository-relative.
          path: loaders/${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: warn

      - name: Verify ${{ matrix.loader }} jar exists
        if: success()
        working-directory: loaders/${{ matrix.loader }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -l build/libs/ || true
          if ! ls build/libs/*.jar >/dev/null 2>&1; then
            {
              echo "The ${{ matrix.loader }} build reported success but produced no jar."
              echo
              echo '```'
              find build -maxdepth 3 -type d | head -40
              echo '--- build.log head (first failure) ---'
              head -250 build.log 2>/dev/null || true
              echo '```'
            } > /tmp/report.md
            gh issue create --repo $GITHUB_REPOSITORY \
              --title "${{ matrix.loader }} produced no jar $GITHUB_RUN_ID" \
              --body-file /tmp/report.md || true
            exit 1
          fi

      # Mirror the Fabric job's dist/ publishing so all four jars are downloadable from
      # the repository itself (blob storage is unreachable in the maintainer's sandbox).
      - name: Publish ${{ matrix.loader }} jar to dist/
        if: "success() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'ci: publish')"
        working-directory: loaders/${{ matrix.loader }}
        run: |
          set -e
          mkdir -p dist
          cp loaders/${{ matrix.loader }}/build/libs/*.jar dist/ 2>/dev/null || {
            echo "no jar produced"; exit 1; }
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && { echo "jar unchanged"; exit 0; }
          git commit -m "ci: publish ${{ matrix.loader }} jar [skip ci]"
          git pull --rebase --autostash
          git push
