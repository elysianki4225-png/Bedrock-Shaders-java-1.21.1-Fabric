name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate shaders (Khronos glslang)
        run: |
          cd verification
          npm install --no-audit --no-fund
          node validate_shaders.mjs

      - name: Validate Bedrock assets
        run: python3 verification/validate_assets.py

      - name: Validate runtime shader pack contract
        run: python3 verification/validate_pack.py

      - name: Test .mcpack importer + localisation
        run: python3 verification/test_importer.py

      - name: Test shader family detection
        run: python3 verification/test_families.py

      - name: Build with Gradle
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish failure report
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 verification/report_failure.py

      - name: Upload mod jars (Fabric + Quilt)
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-shaders-jars-fabric-quilt
          path: build/libs/*.jar
          if-no-files-found: error

      # Blob storage is unreachable from the Arena sandbox, so also publish the
      # jar through git itself: commit it into dist/ on the same branch.
      - name: Publish jar to dist/
        if: "success() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'ci: publish')"
        run: |
          set -e
          mkdir -p dist
          # Only replace the Fabric/Quilt jars this job produced. The loader jobs publish
          # forge/neoforge jars into the same folder from other runners, so a blanket
          # `dist/bedrock-shaders-*.jar` wipe would delete their commits on every run.
          # Clean the current scheme for the two jars built here, plus the pre-rename names.
          rm -f dist/bedrock-shaders-fabric-*.jar dist/bedrock-shaders-quilt-*.jar \
                dist/bedrock-shaders-1.0.0.jar dist/bedrock-shaders-quilt-1.0.0.jar \
                dist/bedrock-shaders-1.0.0-sources.jar
          cp build/libs/*.jar dist/
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "jar unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "ci: publish jar [skip ci]"
          # The loader jobs commit their own jars to dist/ concurrently; rebase before
          # pushing so their commit is not lost to a non-fast-forward rejection.
          git pull --rebase --autostash
          git push

  # Forge and NeoForge are independent Gradle builds (loaders/<loader>) so their
  # toolchains never leak into the Fabric build. They are compiled here, which is the
  # only place the official-mapped port is actually type-checked.
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            task: build
          - loader: forge
            task: build
    # Fabric and Quilt are the priority loads; the Forge/NeoForge ports are built on every
    # push but do not gate the branch while they are being stabilised.
    continue-on-error: true
    name: build (${{ matrix.loader }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build ${{ matrix.loader }}
        id: gradle
        continue-on-error: true
        working-directory: loaders/${{ matrix.loader }}
        run: |
          set +e
          chmod +x ../../gradlew
          ../../gradlew --version > gradle-version.log 2>&1
          echo "gradle --version exit: $?" >> gradle-version.log
          ../../gradlew build --stacktrace --console=plain > build.log 2>&1
          echo "build exit: $?" >> build.log
          echo "=== jars produced ===" >> build.log
          find build -name '*.jar' -printf '%p %s bytes\n' >> build.log 2>&1 || true
          echo "=== first error lines ===" >> build.log
          grep -nE "error:|FAILURE:|What went wrong|A problem occurred|Could not|Unsupported class|Plugin|not found" build.log | head -40 >> build.log 2>&1 || true
          tail -c 3000 build.log || true

      # The sandbox cannot read Actions log blobs, so a failing loader build posts its
      # own diagnostics as an issue: that is the only channel back to the maintainer.
      - name: Publish ${{ matrix.loader }} diagnostics
        if: steps.gradle.outcome == 'failure'
        working-directory: loaders/${{ matrix.loader }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "workflow run: $GITHUB_RUN_ID"
            echo
            echo "### gradle --version"
            echo '```'
            head -20 gradle-version.log 2>/dev/null || echo "no gradle-version.log"
            echo '```'
            echo "### build.log (head, first 250 lines)"
            echo '```'
            head -250 build.log 2>/dev/null || echo "no build.log"
            echo '```'
          } > /tmp/report.md
          gh issue create --repo $GITHUB_REPOSITORY \
            --title "${{ matrix.loader }} build failure $GITHUB_RUN_ID" \
            --body-file /tmp/report.md || true

      - name: Locate ${{ matrix.loader }} jar
        if: success()
        id: locate
        working-directory: loaders/${{ matrix.loader }}
        run: |
          set -e
          echo "--- tasks that ran ---"
          grep -E '^> Task' build.log | tail -30 || true
          echo "--- jars in the build tree ---"
          find build -maxdepth 4 -name '*.jar' -printf '%p %s bytes\n' | sort || true
          # Exclude toolchain intermediates (neoform/mcp/caches produce multi-MB merged
          # Minecraft jars) and prefer the project's own archive name.
          jar=$(find build -maxdepth 4 -name "bedrock-shaders-${{ matrix.loader }}-*.jar" \
                   ! -name '*-sources.jar' -print -quit)
          if [ -z "$jar" ]; then
            jar=$(find build -maxdepth 4 -name '*.jar' ! -name '*-sources.jar' \
                    ! -path '*/neoform/*' ! -path '*/mcp/*' ! -name '*-merged.jar' -print -quit)
          fi
          if [ -z "$jar" ]; then
            echo "::error::The ${{ matrix.loader }} build succeeded but produced no jar"
            exit 1
          fi
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.loader }} jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-shaders-${{ matrix.loader }}
          path: loaders/${{ matrix.loader }}/${{ steps.locate.outputs.jar }}
          if-no-files-found: error



      # Mirror the Fabric job's dist/ publishing so all four jars are downloadable from
      # the repository itself (blob storage is unreachable in the maintainer's sandbox).
      - name: Publish ${{ matrix.loader }} jar to dist/
        if: "success() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'ci: publish')"
        working-directory: loaders/${{ matrix.loader }}
        run: |
          set -e
          mkdir -p ../../dist
          # This step runs inside loaders/<loader>, so dist/ is two levels up.
          # Only the project's own archive is publishable: the toolchain also emits
          # multi-MB merged Minecraft jars (build/*merged*.jar, neoform caches). Picking
          # one of those copied it into dist/, where .gitignore dropped it, and the job
          # still reported success with no jar published. Match the loader name exactly.
          jar=$(find build/libs -maxdepth 1 -name "bedrock-shaders-${{ matrix.loader }}-*.jar" \
                  ! -name '*-sources.jar' -print -quit)
          if [ -z "$jar" ]; then
            echo "::error::no build/libs/bedrock-shaders-${{ matrix.loader }}-*.jar to publish"
            find build -name '*.jar' -printf '%p %s bytes\n' | head -20 || true
            exit 1
          fi
          echo "publishing $jar"
          cp "$jar" ../../dist/
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then echo "jar unchanged"; exit 0; fi
          git commit -m "ci: publish ${{ matrix.loader }} jar [skip ci]"
          git pull --rebase --autostash
          git push
