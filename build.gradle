plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // Every jar names its loader, so downloads in one folder are distinguishable without
    // opening them: -fabric, -forge, -neoforge. There is no -quilt jar: Quilt Loader loads
    // this one directly.
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bedrock_shaders" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Regenerate the packaged shader sources from shadersrc/ before resources are copied,
// so the jar can never ship GLSL that differs from the validated sources.
def syncShaders = tasks.register("syncShaders", Exec) {
    group = "build"
    description = "Regenerates assets/bedrock_shaders/bedrockshader from shadersrc/."
    workingDir = projectDir
    commandLine "node", "verification/sync_shaders.mjs"
    onlyIf { new File(projectDir, "verification/sync_shaders.mjs").isFile() }
}

processResources {
    dependsOn syncShaders
    inputs.property "version", project.version
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Mod metadata carries the version literally (see src/main/resources/fabric.mod.json):
// withSourcesJar() archives the raw resources, so any ${version} placeholder in the
// repository would be shipped verbatim in the sources artifact.


// No separate Quilt artifact. Quilt Loader 0.30+ loads Fabric mods natively (including
// Fabric API, since there is no Quilted Fabric API release for 1.21.1), so
// dist/bedrock-shaders-fabric-1.0.0.jar is the Quilt download as well. Shipping a second
// jar that only swapped metadata meant two things to test, two places for the version to
// drift, and — as happened — a jar whose quilt.mod.json still contained the literal
// ${version} that Quilt Loader refuses. One artifact, one thing to get right.

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
