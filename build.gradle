plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // Every jar names its loader, so four downloads in one folder are distinguishable
    // without opening them: -fabric, -quilt, -forge, -neoforge.
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "bedrock_shaders" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Regenerate the packaged shader sources from shadersrc/ before resources are copied,
// so the jar can never ship GLSL that differs from the validated sources.
def syncShaders = tasks.register("syncShaders", Exec) {
    group = "build"
    description = "Regenerates assets/bedrock_shaders/bedrockshader from shadersrc/."
    workingDir = projectDir
    commandLine "node", "verification/sync_shaders.mjs"
    onlyIf { new File(projectDir, "verification/sync_shaders.mjs").isFile() }
}

processResources {
    dependsOn syncShaders
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// withSourcesJar() copies the *unprocessed* src/main/resources into the sources artifact,
// so fabric.mod.json ships with a literal ${version}: expandable templating that never got
// expanded. Point the sources jar at the processed output instead. The source set still
// carries the client tree, so the artifact stays a readable reference for all four ports.
tasks.named('sourcesJar') {
    // withSourcesJar() packs sourceSets.main.allSource, i.e. the *raw*
    // src/main/resources, so fabric.mod.json shipped the literal ${version}. Rebuild the
    // archive contents explicitly: sources for reference, processed metadata for truth.
    setSource(sourceSets.main.java, sourceSets.client.java)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output) {
        include 'fabric.mod.json'
    }
}


// ---------------------------------------------------------------------------
// Quilt Loader build.
//
// Quilt Loader 0.30 loads Fabric mods natively (Fabric API included, since there is no
// Quilted Fabric API release for 1.21.1), and it reads a quilt.mod.json when one is
// present. So the Quilt artifact is the Fabric jar with the metadata swapped: no code is
// compiled twice and the two jars cannot drift apart.
// ---------------------------------------------------------------------------
def quiltJar = tasks.register('quiltJar', Jar) {
    group = 'build'
    description = 'Builds the Quilt Loader variant: the Fabric jar with quilt.mod.json metadata.'
    archiveBaseName = "${project.archives_base_name}-quilt"
    archiveClassifier = ''
    from(sourceSets.main.output)
    from(sourceSets.client.output)
    // quilt.mod.json carries ${version} like fabric.mod.json does. Copying the raw
    // directory shipped the placeholder into the jar, which Quilt Loader rejects; expand it
    // here the way processResources does for the Fabric metadata.
    from(project.file('src/quilt/resources')) {
        filesMatching('quilt.mod.json') {
            expand 'version': project.version
        }
    }
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}-quilt" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'fabric.mod.json'
    dependsOn processResources, syncShaders
}

tasks.named('assemble') {
    dependsOn quiltJar
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
